name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          # Build-time placeholders. Every route is dynamic, so nothing
          # actually talks to Supabase during the build.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder

  schema:
    name: Schema tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and schema tests
        # The runner user is unprivileged, which is what initdb needs.
        # PostgreSQL server binaries ship with the ubuntu-latest image.
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          echo "Using $PGBIN"
          PGBIN="$PGBIN" bash scripts/test-schema.sh
