name: Keep Supabase awake

# A free Supabase project pauses after 7 days without activity. This hits an
# endpoint that runs a real query, every three days, which counts as activity.
#
# Set the repository secret HEALTHCHECK_URL to
# https://your-app.vercel.app/api/health
#
# Note: GitHub disables scheduled workflows in a repository with no commits
# for 60 days. It emails you first. Push anything to re-enable it.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL secret is not set - skipping."
            exit 0
          fi
          status=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "$HEALTHCHECK_URL")
          echo "HTTP $status"
          cat /tmp/health.json
          echo
          test "$status" = "200"
